<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">
        Login
      </h1>

      <p class="text-gray-500 mt-2">
        เข้าสู่ระบบเพื่อดำเนินการต่อ
      </p>
    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="space-y-5">

      <!-- Username -->
      <div>
        <label
          for="username"
          class="block text-sm font-medium text-gray-700 mb-2">
          Username
        </label>

        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="กรอก Username"
          class="w-full px-4 py-3 border rounded-lg
                 outline-none transition
                 focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500"
          [class.border-red-500]="username?.invalid && username?.touched"
          [class.border-gray-300]="!username?.invalid || !username?.touched"
        />

        @if (username?.hasError('required') && username?.touched) {
          <p class="mt-1 text-sm text-red-500">
            กรุณากรอก Username
          </p>
        }
      </div>

      <!-- Password -->
      <div>
        <label
          for="password"
          class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="กรอก Password"
          class="w-full px-4 py-3 border rounded-lg
                 outline-none transition
                 focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500"
          [class.border-red-500]="password?.invalid && password?.touched"
          [class.border-gray-300]="!password?.invalid || !password?.touched"
        />

        @if (password?.hasError('required') && password?.touched) {
          <p class="mt-1 text-sm text-red-500">
            กรุณากรอก Password
          </p>
        }
      </div>

      <!-- Login -->
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full py-3 bg-blue-600 text-white font-semibold
               rounded-lg transition
               hover:bg-blue-700
               disabled:bg-gray-400
               disabled:cursor-not-allowed">
        Login
      </button>

      <!-- Register -->
      <button
        (click)="onClickToRegisterPage()"
        type="button"
        class="w-full py-3 border border-blue-600
               text-blue-600 font-semibold rounded-lg
               transition hover:bg-blue-50">
        Register
      </button>

    </form>
  </div>
</div>
