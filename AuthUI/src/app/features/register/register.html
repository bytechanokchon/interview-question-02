<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">
        Register
      </h1>

      <p class="text-gray-500 mt-2">
        สร้างบัญชีเพื่อเริ่มต้นใช้งาน
      </p>
    </div>

    <!-- Register Form -->
    <form class="space-y-5">

      <!-- Username -->
      <div>
        <label
          for="username"
          class="block text-sm font-medium text-gray-700 mb-2">
          Username
        </label>

        <input
          id="username"
          type="text"
          placeholder="กรอก Username"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 outline-none transition
                 focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500"
        />
      </div>

      <!-- Password -->
      <div>
        <label
          for="password"
          class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="กรอก Password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 outline-none transition
                 focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500"
        />
      </div>

      <!-- Confirm Password -->
      <div>
        <label
          for="confirmPassword"
          class="block text-sm font-medium text-gray-700 mb-2">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          placeholder="กรอก Password อีกครั้ง"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg
                 outline-none transition
                 focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500"
        />
      </div>

      <!-- Register Button -->
      <button
        type="submit"
        class="w-full py-3 bg-blue-600 text-white font-semibold
               rounded-lg transition
               hover:bg-blue-700
               focus:outline-none
               focus:ring-2
               focus:ring-blue-500
               focus:ring-offset-2">
        Register
      </button>

      <!-- Back to Login -->
      <button
        (click)="onClickGoToLoginPage()"
        type="button"
        class="w-full py-3 border border-gray-300
               text-gray-700 font-semibold rounded-lg
               transition
               hover:bg-gray-100
               focus:outline-none
               focus:ring-2
               focus:ring-gray-400
               focus:ring-offset-2">
        Back to Login
      </button>

    </form>
  </div>
</div>
